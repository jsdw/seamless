[package]
name = "seamless"
version = "0.13.0"
authors = ["James Wilson <james@jsdw.me>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jsdw/seamless"
categories = ["web-programming", "web-programming::http-server", "asynchronous"]
keywords = ["api", "http", "rpc", "json"]
description = """
An opinionated library to easily create RPC style JSON APIs
"""

[features]
default = ["uuid"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
seamless_macros = { version = "0.13.0", path = "../seamless-macros" }
futures = "0.3.34"
bytes = "1"

# Optional dependencies to impl ApiBody for.
uuid = { version = "1", optional = true }

[dev-dependencies]
trybuild = "1.0.120"
pretty_assertions = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.1.0", features = ["rt", "rt-multi-thread", "macros", "net"] }
tokio-util = { version = "0.6.7", features = ["compat"] }
axum = { version = "0.8.9", features = ["macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
