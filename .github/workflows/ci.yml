name: CI

on:
  # Runs for PRs targeting master, including PRs opened from forks.
  pull_request:
    branches: [master]
  # Also run on master itself after merging.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy -p seamless --all-targets --no-default-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit, integration (incl. trybuild compile tests), examples and doc tests.
      - run: cargo test --workspace --all-features

  no_std:
    name: no_std (seamless_info)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      # thumbv7em-none-eabi has no std, so this fails if seamless_info (or any of
      # its dependencies, for any combination of its features) starts relying on std.
      - name: Build (no features)
        run: cargo build -p seamless_info --target thumbv7em-none-eabi
      - name: Build (serialize)
        run: cargo build -p seamless_info --target thumbv7em-none-eabi --features serialize
      - name: Build (deserialize)
        run: cargo build -p seamless_info --target thumbv7em-none-eabi --features deserialize
      - name: Build (all features)
        run: cargo build -p seamless_info --target thumbv7em-none-eabi --all-features
